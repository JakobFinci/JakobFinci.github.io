<div class="card-grid" aria-label="{{ include.aria_label | default: 'Portfolio cards' }}">
  {% for item in include.items %}
  <article class="card-grid__item">
    <a href="{{ item.href }}">
      <img src="{{ item.image }}" alt="{{ item.alt }}">
    </a>
    <p>{{ item.title }}</p>
  </article>
  {% endfor %}
</div>
