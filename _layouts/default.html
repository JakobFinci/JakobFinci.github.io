<!DOCTYPE html>
<html lang="en" class="no-js">
{% include head.html %}
<body class="layout--single {{ page.body_class }}">
  {% unless page.hide_nav %}
    {% include nav.html %}
  {% endunless %}
  <main class="page-main {{ page.main_class }}" role="main">
    {{ content }}
  </main>
  {% unless page.hide_footer %}
    {% include footer.html %}
  {% endunless %}
  <script src="/assets/js/main.min.js"></script>
</body>
</html>
