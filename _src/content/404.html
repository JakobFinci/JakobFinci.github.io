<body class="page--404">
  <main id="main" tabindex="-1">
    <video class="rickroll" autoplay loop playsinline preload="metadata" controls aria-label="Rick Astley music video">
      <source src="/medialib/404.mp4" type="video/mp4">
      Your browser does not support the video tag. <a href="/medialib/404.mp4">Play the video.</a>
    </video>
    <div class="error-message">
      <h1>404 - Page Not Found.</h1>
      <p>Heads Up: This is not my IP, I am not Rick Astley.</p>
    </div>
    <a class="error-home" href="/">Back home</a>
  </main>
  <script>
    const video = document.querySelector('video');
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    function respectMotion() {
      if (motion.matches) { video.removeAttribute('autoplay'); video.pause(); }
    }
    respectMotion();
    motion.addEventListener('change', respectMotion);
  </script>
</body>
</html>
