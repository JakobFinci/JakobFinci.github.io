# Creative work: photography collections and pixel art.
# Rendered on /media/, /media/photography/, /media/pixelart/, and per-collection
# gallery pages. Image dimensions and WebP derivatives come from images.json,
# generated by _src/tools/derivatives.py.
#
# A [[section]] either lists explicit [ [section.image] ] entries (with captions)
# or names a `folder` to enumerate automatically (sorted numerically), using
# `caption_prefix` for alt text. Photography sources live under medialib/.

# ---------------------------------------------------------------------------
# Photography
# ---------------------------------------------------------------------------

[[collection]]
slug = "goldenr"
kind = "photography"
title = "Golden Ratio Alchemy"
url = "/media/photography/goldenr/"
summary = "Selected photographs from Golden Ratio Alchemy, the two-person photography project I'm half of."
intro = """
I'm one half of the photography duo <strong>Golden Ratio Alchemy</strong>, a collaborative project
        that blends creative vision with technical precision to capture striking, meaningful moments.
        Our work ranges from conceptual editorial shoots to candid portraits and event coverage, with an emphasis on balance, detail, and natural light.
        We believe in the magic of visual storytelling and strive to create images that feel timeless and intentional. Here are some of my personal favorite photos. You can <a href="https://goldenratioalchemy.carrd.co/" rel="noopener">book a shoot on our site</a>.
"""
cover = "medialib/photography/goldenr/APR/_MG_2817.jpeg"
order = 1

