order = 3

[[collection.section]]
title = "Goko fan art"
note = """
In 2024 I got the chance to do some freelance consulting for <strong>Goko Energy</strong>, a local beverage company making lightly sparkling, naturally caffeinated coconut water. While these pieces were just done for fun and never actually used in any official Goko adverts or media, I decided to share them here as they
  represent both a time I was experimenting with new tools in Aseprite and are an homage to one of my favorite canned beverages. I hope you enjoy!
"""
