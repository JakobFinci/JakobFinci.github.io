# Creative work: photography collections and pixel art.
# Rendered on /media/, /media/photography/, /media/pixelart/, and per-collection
# gallery pages. Image dimensions and WebP derivatives come from images.json,
# generated by _src/tools/derivatives.py.
#
# A [[section]] either lists explicit [ [section.image] ] entries (with captions)
# or names a `folder` to enumerate automatically (sorted numerically), using
# `caption_prefix` for alt text. Photography sources live under medialib/.

# ---------------------------------------------------------------------------
# Photography
# ---------------------------------------------------------------------------

[[collection]]
slug = "goldenr"
kind = "photography"
title = "Golden Ratio Alchemy"
