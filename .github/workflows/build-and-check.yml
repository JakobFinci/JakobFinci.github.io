name: Build & check

# Rebuilds the site with the standard-library generator and fails if the
# committed HTML is stale or any link/metadata check breaks. Does not deploy —
# GitHub Pages serves the committed files directly (.nojekyll).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify build is not stale
        run: python _src/build.py --check
      - name: Run link & metadata checks
        run: python _src/checks.py
